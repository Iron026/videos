<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:600;src:url(../../episodio_01_navio/projeto/node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../../episodio_01_navio/projeto/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(../../episodio_01_navio/projeto/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:M}
body{background:radial-gradient(ellipse 900px 900px at 50% 40%,#2c3b75 0%,#202B57 55%,#151c3b 100%);color:#F6F4EC;position:relative}
.raios{position:absolute;inset:-300px;transform-origin:50% 44%;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(243,181,68,.05) 0 6deg,transparent 6deg 18deg);mask:radial-gradient(circle at 50% 38%,#000 0,transparent 70%)}
.disco{position:absolute;left:50%;top:800px;width:640px;height:640px;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;
 border:12px solid #F3B544;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 22px rgba(243,181,68,.14)}
.disco img{width:100%;height:100%;display:block}
.titulo{position:absolute;top:1185px;width:100%;text-align:center;font-weight:900;font-size:86px;letter-spacing:-1px;line-height:1}
.slogan{position:absolute;top:1300px;width:100%;text-align:center;font-weight:800;font-size:50px;color:#F3B544}
.handle{position:absolute;top:1395px;width:100%;text-align:center;font-weight:600;font-size:38px;opacity:.82}
.linha{position:absolute;top:1228px;left:50%;width:120px;height:6px;margin-left:-60px;border-radius:3px;background:#F3B544}
</style></head><body><div class="raios" id="raios"></div>
<div class="disco" id="disco"><img src="../referencias/mascote_recorte.png"></div>
<div class="titulo" id="titulo">De Olho no Invisível</div>
<div class="slogan" id="slogan">O invisível ganha forma.</div>
<div class="handle" id="handle">@deolhonoinvisivel</div>
<script>
// Assinatura aprovada, animada. t = segundos desde o início do plano 4 (14,80 s no tempo global).
// Sincronia com a amostra real: "De Olho no Invisível" começa em t = 0,40; "O invisível ganha forma" em t = 2,30.
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const back = x => { x = Math.min(Math.max(x, 0), 1); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function quadro(t) {
  const d = document.getElementById('disco'), r = document.getElementById('raios');
  const kd = back((t - 0.10) / 0.60); d.style.transform = `translate(-50%,-50%) scale(${0.82 + 0.18 * kd})`; d.style.opacity = ease((t - 0.10) / 0.35);
  r.style.transform = `rotate(${t * 4}deg)`; r.style.opacity = ease(t / 0.8);
  for (const [id, t0, dy] of [['titulo', 0.40, 34], ['slogan', 2.30, 26], ['handle', 3.20, 18]]) {
    const e = document.getElementById(id), k = ease((t - t0) / 0.40);
    e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * dy}px)`;
  }
}
quadro(0);
</script></body></html>
